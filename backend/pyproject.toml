[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internhub-backend"
version = "1.0.0"
description = "InternHub API backend (FastAPI)"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "supabase>=2.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "build>=1.0.0",
    "ruff>=0.8.0",
    "bandit[toml]>=1.7.0",
]

[project.scripts]
internhub-serve = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "api*", "services*", "schemas*", "utils*", "db*"]
exclude = ["tests*"]

[tool.setuptools]
py-modules = ["app", "main"]

# Code quality, formatting, tests, coverage
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008", "ARG001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.ruff.format]
indent-width = 4
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "services", "schemas", "utils", "db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore:.*deprecated.*:DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", ".venv/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # assert_used – allow in tests
