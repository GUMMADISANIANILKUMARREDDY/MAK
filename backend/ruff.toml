# Code quality & formatting (indentation, style, safety)
# https://docs.astral.sh/ruff/

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import order)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument (common in FastAPI dependencies)
]

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]   # allow assert, unused args in tests

[format]
indent-width = 4
quote-style = "double"

[lint.isort]
known-first-party = ["api", "config", "services", "schemas", "utils", "db"]
